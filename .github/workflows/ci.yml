name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Prisma Generate
      run: npx prisma generate

    - name: Run Unit Tests
      run: npm run test

    - name: Run Build
      run: npm run build
      env:
        NODE_ENV: production
        DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/nikahyuk_test?schema=public"
        NEXT_PUBLIC_APP_URL: "https://nikahyu.my.id"
        BACKUP_ENCRYPTION_SECRET: "test-secret-min-32-chars-long-for-ci-build"
